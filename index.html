<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EUR/USD Live Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 30px 15px;
      background: #111827;
      color: white;
    }

    .box {
      max-width: 500px;
      margin: auto;
      padding: 25px;
      border-radius: 15px;
      background: #1f2937;
    }

    #price {
      font-size: 42px;
      font-weight: bold;
      margin: 20px 0;
    }

    #status {
      font-size: 18px;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>EUR/USD</h1>

  <div id="status">CONNECTING...</div>

  <div id="price">---</div>

  <div>LIVE PRICE TEST</div>

</div>

<script>

async function getPrice() {

  try {

    const response = await fetch(
      "https://biquote.io/api/EURUSD?t=" + Date.now()
    );

    if (!response.ok) {
      throw new Error("HTTP " + response.status);
    }

    const data = await response.json();

    if (typeof data.mid !== "number") {
      throw new Error("Price not received");
    }

    document.getElementById("price").textContent =
      data.mid.toFixed(5);

    document.getElementById("status").textContent =
      "LIVE — Connected";

  } catch (error) {

    document.getElementById("status").textContent =
      "CONNECTION ERROR";

    console.log(error);
  }
}

getPrice();

setInterval(getPrice, 1000);

</script>

</body>
</html>
